name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试 + 静态检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: 安装 Python 依赖
        run: uv sync --all-extras --dev

      - name: Ruff 静态检查
        run: uv run ruff check app tests

      - name: Ruff 格式检查
        run: uv run ruff format --check app tests

      - name: Alembic 迁移链自检(断链会直接 KeyError)
        run: uv run alembic heads
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci_check.db

      - name: 运行测试
        run: uv run pytest -q --cov=app --cov-report=term-missing --cov-report=xml
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci_test.db
          RICH_TEST_TMP: ${{ runner.temp }}/rich-pytest
          PYTHONIOENCODING: utf-8

  frontend:
    name: 前端类型检查 + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: 构建
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
